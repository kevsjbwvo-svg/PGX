name: Build PGX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: إعداد Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: تثبيت الحزم
        run: npm install

      - name: تجهيز ملفات الويب
        run: |
          mkdir -p www
          cp index.html www/
          cp app.js www/
          cp style.css www/
          cp -r assets www/

      - name: إضافة Android
        run: npx cap add android

      - name: مزامنة Capacitor
        run: npx cap sync android

      - name: إعطاء صلاحية Gradle
        run: chmod +x android/gradlew

      - name: بناء APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: PGX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
